<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="frame">
        <div class="box"> <input type="text" id="show" style="width: 95%;height: 70%;border-radius: 10px; font-size: 40px;" ></div>
        <div class="keyboard">
            <table>
                <tr>
                    <td><button  onclick="click_event('AC')">AC</button></td>
                    <td><button  onclick="click_event('del')">⌫</button></td>
                    <td><button  onclick="click_event('%')">%</button></td>
                    <td><button  onclick="click_event('/')">÷</button></td>
                </tr>
                <tr>
                    <td><button  onclick="click_event('7')">7</button></td>
                    <td><button  onclick="click_event('8')">8</button></td>
                    <td><button  onclick="click_event('9')">9</button></td>
                    <td><button  onclick="click_event('*')">*</button></td>
                </tr>
                <tr>
                    <td><button  onclick="click_event('4')">4</button></td>
                    <td><button  onclick="click_event('5')">5</button></td>
                    <td><button  onclick="click_event('6')">6</button></td>
                    <td><button  onclick="click_event('-')">-</button></td>
                </tr>
                <tr>
                    <td><button  onclick="click_event('1')">1</button></td>
                    <td><button  onclick="click_event('2')">2</button></td>
                    <td><button  onclick="click_event('3')">3</button></td>
                    <td><button  onclick="click_event('+')">+</button></td>
                </tr>
                <tr>
                    <td><button  onclick="click_event('0')">0</button></td>
                    <td><button  onclick="click_event('.')">.</button></td>
                    <td><button  onclick="click_event('=')">=</button></td>
                </tr>
            </table>
        </div>

    </div>
    <script>
        function click_event(a){
            if(a==='AC'){
                show.value='';
            }else if(a==='9'){
                show.value+='9';
            }else if(a==='8'){
                show.value+='8';
            }else if(a==='7'){
                show.value+='7';
            }else if(a==='6'){
                show.value+='6';
            }else if(a==='5'){
                show.value+='5';
            }else if(a==='4'){
                show.value+='4';
            } else if(a==='3'){
                show.value+='3';
            }else if(a==='2'){
                show.value+='2';
            }else if(a==='1'){
                show.value+='1';
            }else if(a==='0'){
                show.value+='0';
            }else if(a==='.'){
                show.value+='.';
            }else if(a==='+'){
                show.value+='+';
            }else if(a==='-'){
                show.value+='-';
            }else if(a==='*'){
                show.value+='*';
            }else if(a==='/'){
                show.value+='/';
            }else if(a==='%'){
                show.value+='%';
            }else if(a==='del'){
                show.value=show.value.slice(0,-1);
            }else if(a==='='){
                show.value=eval(show.value);
            }
        }
       
    </script>
    
    
</body>
</html>
